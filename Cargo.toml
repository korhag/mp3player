[package]
name = "soundkeep"
version = "0.1.9"
edition = "2024"
description = "Minimalist multi-theme music player"
publish = false

[profile.dev]
# Line tables keep builds smaller than full debug info.
debug = "line-tables-only"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
directories = "6.0.0"
iced = { version = "0.14.0", features = ["svg", "image-without-codecs", "tokio", "advanced"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
interprocess = "2.4.5"
lofty = "0.25.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "blocking"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rodio = { version = "0.23.0", features = ["symphonia-all"] }
rss = "2.1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = "1.0.1"
stream-download = { version = "0.24.4", default-features = false, features = ["http", "reqwest-rustls", "temp-storage"] }
tokio = { version = "1.53.3", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target."cfg(windows)".dependencies]
tao = "0.37.1"
wry = "0.57.0"
